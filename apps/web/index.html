<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e17" />
    <title>猫踪 CatTrail · 骑行地图</title>
    <script>
      // 提前应用主题，避免闪色
      var t = localStorage.getItem('cattrail-theme') === 'day' ? 'day' : 'night';

      document.documentElement.style.background = t === 'day' ? '#f4f1e8' : '#0a0e17';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
